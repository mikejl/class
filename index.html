<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Materials</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #24292f;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 10px 0;
        }

        #status {
            margin: 20px 0;
            font-style: italic;
        }

        .page-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .page {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .page:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }

        .page a {
            text-decoration: none;
            color: #0969da;
            font-weight: bold;
            font-size: 18px;
        }

        .filename {
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        .error {
            background: #ffe0e0;
            color: #900;
            padding: 15px;
            border-radius: 6px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>Course Materials</h1>
    <p>HTML pages available in this GitHub repository.</p>
</header>
<a href="https://mikejl.github.io/class/buffer_overflow_lab.html">Buffer Overflow Lab</a>
<a href="https://mikejl.github.io/class/cloud-security-lab.html">Cloud Security Lab</a>
<a href="https://mikejl.github.io/class/iot-security-lab.html">IoT Security Lab</a>

</body>
</html>
